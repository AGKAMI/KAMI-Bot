name: Deploy to bot-hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Restart live deployment via bot-hosting MCP
        env:
          BH_API_KEY: ${{ secrets.BOT_HOSTING_API_KEY }}
          DEPLOYMENT_ID: ${{ secrets.BOT_HOSTING_SERVER_ID }}
        run: |
          if [ -z "$BH_API_KEY" ]; then
            echo "::error::Missing BOT_HOSTING_API_KEY secret (bhk_ key)"
            exit 1
          fi

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::Missing BOT_HOSTING_SERVER_ID secret (deployment UUID)"
            exit 1
          fi

          echo "Restarting deployment ${DEPLOYMENT_ID} (auto-pull on restart)..."
          RESP=$(curl -sS --max-time 240 https://bot-hosting.net/api/mcp \
            -H "Authorization: Bearer ${BH_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"deployments_power\",\"arguments\":{\"id\":\"${DEPLOYMENT_ID}\",\"action\":\"restart\",\"waitSeconds\":30}}}")

          echo "$RESP" | python3 -c '
          import sys, json
          raw = sys.stdin.read()
          try:
              r = json.loads(raw)
          except Exception:
              print("::error::Non-JSON response from MCP:", raw[:500]); sys.exit(1)
          if "error" in r:
              print("::error::MCP error:", r["error"]); sys.exit(1)
          text = r.get("result", {}).get("content", [{}])[0].get("text", "")
          try:
              data = json.loads(text)
          except Exception:
              print(text[:1500]); sys.exit(0)
          print("ok:", data.get("ok"))
          print("state:", data.get("state") or data.get("status"))
          print("payload keys:", ", ".join(data.keys()))
          if data.get("ok") is False:
              print("::warning::Restart not accepted — check panel console")
          tail = data.get("console") or data.get("logs") or data.get("consoleOutput") or ""
          if tail:
              print("--- console tail ---")
              print(str(tail)[-1500:])
          '
