services:
  - type: web
    name: kami-cloud-api
    runtime: node
    rootDir: cloud-api
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        value: kami-cloud-api-verify
