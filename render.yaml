services:
  - type: web
    name: kami-cloud-api
    runtime: node
    rootDir: cloud-api
    buildCommand: cd cloud-api && npm install
    startCommand: cd cloud-api && node server.js
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: VERIFY_TOKEN
        value: kami-cloud-api-verify
